name: Documentation and SideStore source

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
      - edited
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('icansii-pages-pr-{0}', github.event.pull_request.number) || 'icansii-pages-production' }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate source and build site
    runs-on: ubuntu-latest

    steps:
      # A release event normally checks out the tagged commit. We explicitly
      # validate the current default branch because apps.json lives there.
      - name: Checkout default branch for a release event
        if: github.event_name == 'release'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout triggering revision
        if: github.event_name != 'release'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Run validator unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Validate apps.json locally
        run: |
          python scripts/validate_source.py apps.json \
            --repository "${{ github.repository }}"

      # PRs cannot be required to reference a Release that has not been
      # published yet. Strict cross-validation starts as soon as main changes,
      # or whenever a Release is published/edited.
      - name: Cross-check apps.json with published GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ github.event.action }}
        run: |
          retries=0

          # gh release create uploads assets immediately after creating the
          # Release. A short retry window absorbs that normal API race.
          if [ "${{ github.event_name }}" = "release" ] && [ "$RELEASE_ACTION" = "published" ]; then
            retries=6
          fi

          python scripts/validate_source.py apps.json \
            --repository "${{ github.repository }}" \
            --check-releases \
            --retries "$retries" \
            --retry-delay 10

      - name: Build MkDocs site
        run: mkdocs build --strict --site-dir site

      - name: Copy SideStore distribution files
        run: |
          cp apps.json site/apps.json
          cp add-source.html site/add-source.html
          mkdir -p site/assets
          rsync -a assets/ site/assets/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
